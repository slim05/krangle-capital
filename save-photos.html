<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save Contest Photos</title>
<style>
  :root { --green:#194429; --gold:#B8902F; --cream:#F4ECD8; --ink:#1A1A1A; --red:#8A281D; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,Arial,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-family:Georgia,serif; color:var(--green); font-size:26px; margin:0 0 6px; }
  #status { margin:0 0 16px; font-size:15px; }
  button { width:100%; padding:16px; font-size:17px; font-weight:600; border:0; border-radius:12px;
           background:var(--green); color:#fff; }
  button:disabled { background:#8a9a8f; }
  .hint { font-size:13px; color:#555; margin:10px 0 20px; line-height:1.4; }
  .err { color:var(--red); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:6px; }
  #grid a { position:relative; display:block; aspect-ratio:1; overflow:hidden; border-radius:6px; background:#ddd; }
  #grid img { width:100%; height:100%; object-fit:cover; display:block; }
  #grid a.saved::after { content:"Saved"; position:absolute; inset:auto 4px 4px auto; background:var(--green);
           color:#fff; font-size:11px; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>Photo contest archive</h1>
  <p id="status">Loading photos…</p>
  <button id="saveBtn" disabled>Loading…</button>
  <p class="hint">Each tap saves a batch of 10 full resolution photos. In the share menu, choose
    <b>Save Images</b>. Need just one? Tap a thumbnail, then press and hold the photo and choose Save to Photos.</p>
  <div id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async function () {
  const BATCH = 10;
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("saveBtn");
  const grid = document.getElementById("grid");
  const say = (msg, isErr) => { statusEl.textContent = msg; statusEl.className = isErr ? "err" : ""; };

  const cfg = window.KC_CONFIG || {};
  if (!cfg.SUPABASE_URL || !window.supabase) { say("Could not connect to the database.", true); return; }
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const pub = (path) => sb.storage.from("photos").getPublicUrl(path).data.publicUrl;

  const { data, error } = await sb.rpc("list_gallery");
  if (error) { say("Could not load the gallery: " + error.message, true); return; }
  const photos = data || [];
  if (!photos.length) { say("No photos found.", true); btn.textContent = "Nothing to save"; return; }

  const links = photos.map((p) => {
    const a = document.createElement("a");
    a.href = pub(p.full_path); a.target = "_blank";
    const img = document.createElement("img");
    img.src = pub(p.thumb_path); img.loading = "lazy"; img.alt = p.owner_name || "";
    a.appendChild(img); grid.appendChild(a);
    return a;
  });

  const fileName = (p, i) => {
    const who = String(p.owner_name || "guest").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "");
    return "jingle-mingle-" + String(i + 1).padStart(3, "0") + "-" + who + ".jpg";
  };

  const testFile = new File([""], "t.jpg", { type: "image/jpeg" });
  const canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [testFile] }));

  let next = 0, ready = null;
  const failed = [];

  async function prepare() {
    if (next >= photos.length) {
      ready = null; btn.disabled = true; btn.textContent = "All photos saved";
      say("Done. " + photos.length + " photos." + (failed.length ? " Could not load #" + failed.join(", #") + ". Save those from the grid." : ""), failed.length > 0);
      return;
    }
    const start = next, end = Math.min(next + BATCH, photos.length);
    btn.disabled = true; btn.textContent = "Preparing photos " + (start + 1) + " to " + end + "…";
    const files = [];
    for (let i = start; i < end; i++) {
      try {
        const r = await fetch(pub(photos[i].full_path));
        if (!r.ok) throw new Error(r.status);
        files.push(new File([await r.blob()], fileName(photos[i], i), { type: "image/jpeg" }));
      } catch (e) { failed.push(i + 1); }
    }
    ready = { start, end, files };
    btn.disabled = false;
    btn.textContent = "Save photos " + (start + 1) + " to " + end + " of " + photos.length;
  }

  function markSaved(r) { for (let i = r.start; i < r.end; i++) links[i].classList.add("saved"); }

  btn.addEventListener("click", async () => {
    if (!ready) return;
    const r = ready;
    if (!r.files.length) { next = r.end; prepare(); return; }
    if (canShareFiles) {
      try {
        await navigator.share({ files: r.files });
      } catch (e) {
        if (e.name === "AbortError") { say("Canceled. Tap the button to try this batch again."); return; }
        say("Sharing failed (" + e.name + "). Tap the button to try again.", true); return;
      }
    } else {
      for (const f of r.files) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(f); a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
        await new Promise((res) => setTimeout(res, 400));
      }
    }
    markSaved(r);
    say("Saved " + r.end + " of " + photos.length + ".");
    next = r.end; ready = null;
    prepare();
  });

  say(photos.length + " photos found.");
  prepare();
})();
</script>
</body>
</html>
