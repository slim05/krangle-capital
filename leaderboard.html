<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krangle Capital — Live Net Worth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
body{padding:18px}
/* the board fills the screen height; the net worth list scrolls inside it */
.tv{display:flex;flex-direction:column;height:calc(100vh - 36px);min-height:520px}
.tv .tvgrid{flex:1;min-height:0}
.lbwrap{position:relative;height:100%;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 46px),transparent 100%);
          mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 46px),transparent 100%)}
.lbtrack{will-change:transform}
.lbtrack .lbcopy + .lbcopy{display:none}
.lbtrack.looping .lbcopy + .lbcopy{display:block}
.lbgap{display:none;text-align:center;padding:22px 0 26px;font-family:"Fraunces";font-weight:600;font-size:13px;
  letter-spacing:.3em;text-transform:uppercase;color:rgba(200,161,75,.55)}
.lbtrack.looping .lbgap{display:block}
.side{overflow:hidden}
/* bottom news ticker: much slower crawl (was 26s) */
.ticker .run{animation-duration:110s}
.fsbtn{margin-left:14px;background:transparent;color:var(--gold-soft);border:1.5px solid rgba(200,161,75,.55);
  border-radius:999px;padding:7px 14px;font:600 12px "Archivo",sans-serif;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:opacity .3s}
.fsbtn:hover{background:rgba(200,161,75,.15)}
/* full screen: edge to edge, button fades until you hover it */
body.is-full{padding:0;background:#0a130d}
body.is-full #tv{max-width:none !important}
body.is-full .tv{height:100vh;border-radius:0;border:0;padding:30px 44px 0}
body.is-full .ticker{margin-left:-44px;margin-right:-44px}
body.is-full .fsbtn{opacity:.12}
body.is-full .fsbtn:hover{opacity:1}
body.is-full .tv .tvhead .t b{font-size:40px}
body.is-full .rank .nm b{font-size:21px}
body.is-full .rank .bal{font-size:22px}
body.is-full .rank img,body.is-full .rank .mono-av{width:50px;height:50px}
@media(max-width:680px){.tv{height:auto}.lbwrap{height:70vh}}
</style>
</head>
<body>
<div id="tv" style="max-width:1180px;margin:0 auto">
  <div class="loading"><div class="spinner"></div><div>Tallying net worth…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
